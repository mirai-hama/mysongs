<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d45b8">
<meta name="description" content="自分専用のギターコード譜アプリ">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>MySongs</title>
<style>
:root{--purple:#6d45b8;--purple2:#8b6ad0;--bg:#f7f4fc;--ink:#262132;--muted:#706a7d;--line:#e4dced}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#59349e,#8d69cf);color:white;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #38205a22}
.headrow{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:#ffffff25;display:grid;place-items:center;font-size:23px}
h1{font-size:22px;margin:0}header p{font-size:12px;margin:3px 0 0;opacity:.88}
main{max-width:760px;margin:auto;padding:14px 12px 40px}
button,.filelabel{border:0;border-radius:12px;padding:11px 13px;background:var(--purple);color:white;font-weight:650;font-size:14px;cursor:pointer}
button.secondary,.filelabel.secondary{background:#eee8f8;color:#4d347b}button.ghost{background:transparent;color:var(--purple);border:1px solid var(--line)}button.danger{background:#a83b59}
button:active{transform:scale(.98)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #38205a08}
input,textarea,select{font:inherit;width:100%;border:1px solid #d9cde8;border-radius:10px;padding:11px;background:white;color:var(--ink)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.hint{font-size:12px;color:var(--muted);line-height:1.6}
.songrow{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #f0ebf6}.songrow:last-child{border:0}
.songtitle{font-weight:750;flex:1;min-width:0;overflow-wrap:anywhere}.songmeta{font-size:12px;color:var(--muted);margin-top:3px}
.smallbtn{padding:8px 10px;font-size:12px;border-radius:9px;white-space:nowrap}
.hidden{display:none!important}.sectiontitle{font-size:17px;margin:6px 0 10px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
#sheetTitle{font-size:20px;margin:2px 0 12px}
.sheet{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;overflow-wrap:anywhere}

/* コード図の幅が歌詞の位置に影響しないレイアウト */
.sheetline{display:block;position:relative;line-height:1.6;min-height:1.6em;white-space:pre-wrap;margin:0 0 5px;padding-top:0}
.sheetline.hasChords{padding-top:58px}
.lyricUnit{display:inline-block;position:relative;vertical-align:bottom;white-space:pre;line-height:1.4}
.unitChord{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);width:47px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;white-space:normal}
.chord{display:block;width:47px;text-align:center;font-weight:800;color:#7144bb;font-size:13px;line-height:16px;white-space:pre}
.chorddiagram{display:block;width:47px;height:39px;overflow:visible;margin:1px 0 0;flex:none}
.lyric{display:block;font-size:15px;line-height:1.4;white-space:pre}
.sheet.compact .lyric{font-size:13.5px}.sheet.compact .sheetline{line-height:1.35;margin-bottom:3px}
#scrollArea{max-height:62vh;overflow:auto;scroll-behavior:smooth}
.scrolltools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.scrolltools input[type=range]{width:120px;padding:0}
#editorText{min-height:160px;line-height:1.65;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.notice{padding:10px 12px;background:#f0eafb;border-radius:12px;font-size:12px;line-height:1.6;color:#513b79}
#lyricPreview{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:60px;touch-action:pan-x pan-y}
.previewLine{display:flex;align-items:flex-end;min-height:53px;white-space:pre;margin-bottom:5px}
button.previewChar{appearance:none;-webkit-appearance:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:0 0 auto;min-width:9px;min-height:48px;margin:0;padding:0;border:0;border-radius:4px;background:transparent;color:inherit;box-shadow:none;font:inherit;font-weight:400;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:#d9c8ff88}
button.previewChar:active{background:#eee5fb;transform:none}
button.previewChar:focus-visible{outline:2px solid #8b6ad0;outline-offset:1px}
button.previewChar.selected{background:#e8dcff;outline:1px solid #b79beb}
.previewChord{height:19px;font-size:12px;font-weight:800;color:var(--purple);white-space:nowrap;pointer-events:none}
.previewLyric{font-size:16px;line-height:1.5;white-space:pre;pointer-events:none}
.palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.palette button{min-width:48px;padding:10px 9px}
.palette button.chosen{background:#38205a;outline:2px solid #bca5e7}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
@media print{
 body{background:white!important;color:#000!important}
 header,.no-print,#homeView,#editView,footer{display:none!important}
 main{max-width:none;margin:0;padding:0}
 .card,.sheet{border:0;box-shadow:none;padding:0;margin:0;border-radius:0}
 #playView{display:block!important}.print-only{display:block!important}
 #scrollArea{max-height:none;overflow:visible}
 #sheetTitle{font-size:16pt;margin:0 0 10pt}
 .sheetline{break-inside:avoid;margin-bottom:3pt}
 .chord{color:#000}.lyric{font-size:10pt}
 .sheet.compact .lyric{font-size:9pt}
 @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<header><div class="headrow"><div class="logo">♫</div><div><h1>MySongs</h1><p>自分だけのギターコード譜</p></div></div></header>
<main>

 <div class="toolbar">
  <button id="newSongBtn">＋ 曲を追加</button>

 </div>

 <div class="card">
  <div class="topline"><h2 class="sectiontitle">マイソング</h2><span id="songCount" class="hint">0曲</span></div>
  <div id="songList"></div><div id="emptyState" class="hint">まだ曲がありません。「＋ 曲を追加」から登録してね。</div>
 </div>

 <div class="toolbar"><button id="backFromEdit" class="ghost">← 曲一覧</button><button id="saveSongBtn">保存する</button></div>

  <textarea id="editorText" spellcheck="false" placeholder="ここに歌詞を入力してね。&#10;例：君を忘れない&#10;曲がりくねった道を行く"></textarea>
